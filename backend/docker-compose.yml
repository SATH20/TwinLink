version: '3.8'

services:
  # ── NestJS Backend ─────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twinlink-backend
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - CORS_ORIGINS=http://localhost:3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_SERVICE_URL=http://fastapi:8000
      - AI_SERVICE_TIMEOUT=30000
    env_file:
      - .env
    depends_on:
      - redis
      - fastapi
    volumes:
      - ./private.json:/app/private.json:ro
    restart: unless-stopped
    networks:
      - twinlink-network

  # ── Redis (BullMQ) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: twinlink-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - twinlink-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI AI Service ─────────────────────────────────
  fastapi:
    build:
      context: ../fastapi-engine
      dockerfile: Dockerfile
    container_name: twinlink-ai-engine
    ports:
      - '8000:8000'
    env_file:
      - ../fastapi-engine/.env
    restart: unless-stopped
    networks:
      - twinlink-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
    driver: local

networks:
  twinlink-network:
    driver: bridge
